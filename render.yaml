services:
  - type: web
    name: phungu-agent
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: cd agent-render && .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROVIDER_ORDER
        value: openrouter,gemini,groq
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: MAX_AGENT_STEPS
        value: "6"
      - key: MAX_HISTORY
        value: "8"
    healthCheckPath: /health
    autoDeploy: true